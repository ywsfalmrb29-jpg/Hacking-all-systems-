<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 Edman Haking | Hacker's Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ============================================
   EDMAN HAKING - HACKER'S SIMULATOR
   الرد 1: HTML + CSS كامل
   ============================================ */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --dark: #05050a;
  --dark-2: #0a0a15;
  --dark-3: #12121f;
  --matrix: #00ff41;
  --matrix-dim: #00aa2a;
  --purple: #a855f7;
  --purple-light: #c084fc;
  --gold: #d4af37;
  --gold-light: #f4d47c;
  --text: #e8e8f0;
  --text-dim: #9a9ab0;
  --danger: #ff0044;
  --success: #00ff41;
  --warning: #ffaa00;
}

body {
  font-family: 'Cairo', sans-serif;
  background: var(--dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  line-height: 1.6;
}

/* خلفية Matrix */
#matrix-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  opacity: 0.25;
  pointer-events: none;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.15), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(0, 255, 65, 0.08), transparent 45%);
  z-index: 1;
  pointer-events: none;
}

/* ===== شاشة البداية ===== */
.boot-screen {
  position: fixed;
  inset: 0;
  background: var(--dark);
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  font-family: 'Share Tech Mono', monospace;
  color: var(--matrix);
  transition: opacity 1s ease;
}

.boot-screen.hide {
  opacity: 0;
  pointer-events: none;
}

.boot-text {
  font-size: 1.1rem;
  text-align: left;
  max-width: 500px;
  padding: 20px;
  line-height: 2;
}

.boot-line {
  opacity: 0;
  animation: bootFade 0.4s forwards;
}

@keyframes bootFade {
  to { opacity: 1; }
}

/* ===== الهيدر ===== */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(5, 5, 10, 0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0, 255, 65, 0.2);
  flex-wrap: wrap;
  gap: 15px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--matrix);
  font-family: 'Share Tech Mono', monospace;
  text-shadow: 0 0 10px var(--matrix);
}

.logo .cat {
  font-size: 1.8rem;
  animation: catBob 2s ease-in-out infinite;
}

@keyframes catBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.user-stats {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 15px;
  background: rgba(0, 255, 65, 0.08);
  border: 1px solid rgba(0, 255, 65, 0.3);
  border-radius: 20px;
  font-size: 0.9rem;
  font-weight: 700;
}

.stat-item .icon { font-size: 1.1rem; }
.stat-item .value { color: var(--matrix); font-family: 'Share Tech Mono', monospace; }

.level-badge {
  padding: 8px 15px;
  background: linear-gradient(135deg, var(--purple), var(--purple-light));
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 700;
  color: #fff;
  box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
}

/* ===== المحتوى ===== */
main {
  position: relative;
  z-index: 5;
  padding: 40px 20px;
  max-width: 1200px;
  margin: 0 auto;
}

/* Hero */
.hero {
  text-align: center;
  margin-bottom: 50px;
  animation: fadeInUp 1s ease;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero h1 {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 900;
  margin-bottom: 15px;
  font-family: 'Share Tech Mono', monospace;
  color: var(--matrix);
  text-shadow: 
    0 0 10px var(--matrix),
    0 0 20px var(--matrix),
    0 0 40px var(--matrix);
  position: relative;
  display: inline-block;
}

.glitch {
  position: relative;
  display: inline-block;
}

.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.glitch::before {
  color: var(--purple);
  animation: glitch1 2s infinite;
  clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
}

.glitch::after {
  color: var(--danger);
  animation: glitch2 2s infinite;
  clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
}

@keyframes glitch1 {
  0%, 100% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(-2px, -2px); }
  60% { transform: translate(2px, 2px); }
  80% { transform: translate(2px, -2px); }
}

@keyframes glitch2 {
  0%, 100% { transform: translate(0); }
  20% { transform: translate(2px, -2px); }
  40% { transform: translate(2px, 2px); }
  60% { transform: translate(-2px, -2px); }
  80% { transform: translate(-2px, 2px); }
}

.hero p {
  color: var(--text-dim);
  font-size: 1.1rem;
  max-width: 700px;
  margin: 0 auto;
}

/* ===== أقسام رئيسية ===== */
.section {
  margin-bottom: 50px;
}

.section-title {
  font-size: 1.6rem;
  font-weight: 900;
  margin-bottom: 25px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--gold);
  font-family: 'Share Tech Mono', monospace;
  position: relative;
  padding-right: 15px;
}

.section-title::before {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 5px;
  height: 30px;
  background: var(--gold);
  border-radius: 3px;
  box-shadow: 0 0 15px var(--gold);
}

.section-title.offense { color: var(--danger); }
.section-title.offense::before { background: var(--danger); box-shadow: 0 0 15px var(--danger); }

.section-title.defense { color: var(--matrix); }
.section-title.defense::before { background: var(--matrix); box-shadow: 0 0 15px var(--matrix); }

/* ===== شبكة المهام ===== */
.missions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.mission-card {
  background: linear-gradient(135deg, rgba(10, 10, 21, 0.95), rgba(18, 18, 31, 0.95));
  border: 1px solid rgba(0, 255, 65, 0.2);
  border-radius: 15px;
  padding: 22px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.mission-card::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 4px;
  height: 100%;
  background: var(--matrix);
  transform: scaleY(0);
  transition: transform 0.3s;
}

.mission-card:hover {
  transform: translateY(-5px);
  border-color: var(--matrix);
  box-shadow: 0 15px 40px rgba(0, 255, 65, 0.15);
}

.mission-card:hover::before {
  transform: scaleY(1);
}

.mission-card.offense {
  border-color: rgba(255, 0, 68, 0.3);
}

.mission-card.offense::before { background: var(--danger); }

.mission-card.offense:hover {
  border-color: var(--danger);
  box-shadow: 0 15px 40px rgba(255, 0, 68, 0.2);
}

.mission-card.defense::before { background: var(--matrix); }

.mission-card.locked {
  opacity: 0.5;
  cursor: not-allowed;
  filter: grayscale(0.7);
}

.mission-card.completed {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(18, 18, 31, 0.95));
}

.mission-card.completed::after {
  content: '✓';
  position: absolute;
  top: 15px;
  left: 15px;
  width: 30px;
  height: 30px;
  background: var(--gold);
  color: var(--dark);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 1.1rem;
  box-shadow: 0 0 20px var(--gold);
}

.mission-header {
  display: flex;
  align-items: flex-start;
  gap: 15px;
  margin-bottom: 12px;
}

.mission-icon {
  font-size: 2rem;
  flex-shrink: 0;
}

.mission-info { flex: 1; }

.mission-name {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 5px;
}

.mission-desc {
  font-size: 0.85rem;
  color: var(--text-dim);
  line-height: 1.5;
}

.mission-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.mission-points {
  font-family: 'Share Tech Mono', monospace;
  color: var(--gold);
  font-weight: 700;
  font-size: 0.9rem;
}

.mission-difficulty {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 700;
}

.diff-easy { background: rgba(0, 255, 65, 0.15); color: var(--success); border: 1px solid var(--success); }
.diff-medium { background: rgba(255, 170, 0, 0.15); color: var(--warning); border: 1px solid var(--warning); }
.diff-hard { background: rgba(255, 0, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
.diff-expert { background: rgba(168, 85, 247, 0.15); color: var(--purple-light); border: 1px solid var(--purple); }

/* ===== نافذة المهمة ===== */
.mission-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(10px);
  z-index: 1000;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  animation: fadeIn 0.3s;
}

.mission-modal.active { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  background: linear-gradient(135deg, #0a0a15, #12121f);
  border: 2px solid var(--matrix);
  border-radius: 20px;
  max-width: 800px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 0 60px rgba(0, 255, 65, 0.4);
  animation: modalSlide 0.4s ease;
  position: relative;
}

@keyframes modalSlide {
  from { transform: scale(0.9) translateY(30px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.modal-header {
  padding: 25px;
  border-bottom: 1px solid rgba(0, 255, 65, 0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0, 255, 65, 0.05);
}

.modal-title {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--matrix);
  font-family: 'Share Tech Mono', monospace;
}

.close-btn {
  background: transparent;
  border: 2px solid var(--danger);
  color: var(--danger);
  width: 35px;
  height: 35px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.2rem;
  font-weight: 700;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.close-btn:hover {
  background: var(--danger);
  color: #fff;
  transform: rotate(90deg);
}

.modal-body {
  padding: 25px;
}

.mission-brief {
  background: rgba(0, 255, 65, 0.05);
  border-right: 4px solid var(--matrix);
  padding: 18px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.mission-brief h4 {
  color: var(--matrix);
  font-family: 'Share Tech Mono', monospace;
  margin-bottom: 10px;
  font-size: 1rem;
}

.mission-brief p {
  color: var(--text-dim);
  font-size: 0.95rem;
  line-height: 1.7;
}

.hint-box {
  background: rgba(212, 175, 55, 0.08);
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 20px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.hint-box .hint-icon {
  font-size: 1.3rem;
  flex-shrink: 0;
}

.hint-box .hint-text {
  color: var(--gold-light);
  font-size: 0.9rem;
  line-height: 1.6;
}

/* Terminal */
.terminal {
  background: #000;
  border: 1px solid var(--matrix);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
}

.terminal-header {
  background: #0a0a0a;
  padding: 10px 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--matrix);
}

.term-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.term-dot.red { background: #ff5f56; }
.term-dot.yellow { background: #ffbd2e; }
.term-dot.green { background: #27c93f; }

.terminal-title {
  margin-right: auto;
  margin-left: auto;
  color: var(--matrix);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85rem;
}

.terminal-body {
  padding: 20px;
  min-height: 150px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.9rem;
  color: var(--matrix);
  line-height: 1.6;
}

.terminal-output {
  white-space: pre-wrap;
  word-break: break-word;
}

.terminal-line {
  margin-bottom: 8px;
  animation: termLine 0.3s ease;
}

@keyframes termLine {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

.term-error { color: var(--danger); }
.term-success { color: var(--matrix); }
.term-warning { color: var(--warning); }
.term-info { color: var(--purple-light); }

/* منطقة الإدخال */
.command-input-area {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.command-input {
  flex: 1;
  padding: 15px 18px;
  background: #000;
  border: 2px solid var(--matrix);
  border-radius: 10px;
  color: var(--matrix);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.95rem;
  outline: none;
  transition: all 0.3s;
}

.command-input:focus {
  box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
}

.command-input::placeholder {
  color: rgba(0, 255, 65, 0.4);
}

.run-btn {
  padding: 15px 30px;
  background: linear-gradient(135deg, var(--matrix), var(--matrix-dim));
  color: #000;
  border: none;
  border-radius: 10px;
  font-weight: 900;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-size: 1rem;
  transition: all 0.3s;
  box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
}

.run-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 40px rgba(0, 255, 65, 0.6);
}

.run-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* شاشة Matrix للنجاح */
.matrix-success {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 2000;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
}

.matrix-success.active { display: flex; }

.matrix-canvas-full {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.6;
}

.matrix-message {
  position: relative;
  z-index: 10;
  text-align: center;
  color: var(--matrix);
  padding: 20px;
  animation: matrixMsg 1s ease;
}

@keyframes matrixMsg {
  from { opacity: 0; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1); }
}

.matrix-message .big-icon {
  font-size: 5rem;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 30px var(--matrix));
  animation: pulseIcon 1s infinite;
}

@keyframes pulseIcon {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.matrix-message h2 {
  font-size: clamp(1.5rem, 5vw, 2.5rem);
  margin-bottom: 15px;
  text-shadow: 
    0 0 10px var(--matrix),
    0 0 20px var(--matrix),
    0 0 40px var(--matrix);
  font-weight: 900;
}

.matrix-message .loot {
  font-size: 1.2rem;
  margin: 20px 0;
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold);
}

.matrix-message .hack-details {
  background: rgba(0, 255, 65, 0.1);
  border: 1px solid var(--matrix);
  border-radius: 10px;
  padding: 20px;
  margin: 20px auto;
  max-width: 500px;
  text-align: right;
  font-size: 0.9rem;
  line-height: 2;
}

.continue-btn {
  padding: 15px 40px;
  background: linear-gradient(135deg, var(--matrix), var(--matrix-dim));
  color: #000;
  border: none;
  border-radius: 50px;
  font-weight: 900;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-size: 1.1rem;
  margin-top: 20px;
  transition: all 0.3s;
  box-shadow: 0 0 30px rgba(0, 255, 65, 0.5);
}

.continue-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 60px rgba(0, 255, 65, 0.8);
}

/* شاشة الفشل */
.fail-screen {
  position: fixed;
  inset: 0;
  background: rgba(20, 0, 5, 0.95);
  backdrop-filter: blur(10px);
  z-index: 2000;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.fail-screen.active { display: flex; }

.fail-content {
  background: linear-gradient(135deg, #1a0005, #2a000a);
  border: 2px solid var(--danger);
  border-radius: 20px;
  padding: 40px 30px;
  max-width: 600px;
  text-align: center;
  animation: shake 0.5s ease;
  box-shadow: 0 0 60px rgba(255, 0, 68, 0.5);
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

.fail-content .fail-icon {
  font-size: 4rem;
  margin-bottom: 15px;
}

.fail-content h2 {
  color: var(--danger);
  font-size: 1.8rem;
  margin-bottom: 20px;
  font-family: 'Share Tech Mono', monospace;
}

.fail-content .roast {
  background: rgba(0, 0, 0, 0.5);
  border-right: 4px solid var(--danger);
  padding: 18px;
  border-radius: 10px;
  margin: 20px 0;
  text-align: right;
  color: var(--warning);
  font-size: 1rem;
  line-height: 1.8;
  font-weight: 700;
}

.fail-content .learn-hint {
  color: var(--text-dim);
  font-size: 0.9rem;
  line-height: 1.8;
  margin-bottom: 20px;
  text-align: right;
}

.retry-btn {
  padding: 15px 40px;
  background: linear-gradient(135deg, var(--danger), #cc0033);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-weight: 900;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-size: 1rem;
  margin: 10px 5px;
  transition: all 0.3s;
}

.retry-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(255, 0, 68, 0.5);
}

.cancel-btn {
  padding: 15px 40px;
  background: transparent;
  border: 2px solid var(--text-dim);
  color: var(--text-dim);
  border-radius: 50px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-size: 1rem;
  margin: 10px 5px;
  transition: all 0.3s;
}

.cancel-btn:hover {
  border-color: var(--text);
  color: var(--text);
}

/* ===== القط سكرين العائم ===== */
.cat-helper {
  position: fixed;
  bottom: 25px;
  left: 25px;
  z-index: 500;
  cursor: pointer;
  transition: all 0.3s;
}

.cat-helper:hover {
  transform: scale(1.15);
}

.cat-emoji {
  font-size: 3rem;
  filter: drop-shadow(0 0 15px var(--matrix));
  animation: catFloat 3s ease-in-out infinite;
}

@keyframes catFloat {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-10px) rotate(5deg); }
}

.cat-bubble {
  position: absolute;
  bottom: 100%;
  left: 0;
  margin-bottom: 15px;
  background: linear-gradient(135deg, #12121f, #0a0a15);
  border: 2px solid var(--matrix);
  border-radius: 15px;
  padding: 12px 18px;
  min-width: 200px;
  max-width: 280px;
  color: var(--matrix);
  font-size: 0.85rem;
  font-weight: 700;
  line-height: 1.5;
  box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
  opacity: 0;
  transform: translateY(10px);
